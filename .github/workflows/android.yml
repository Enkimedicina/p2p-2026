name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Sin disparador `pull_request`: con un PR abierto, cada push generaba dos
# ejecuciones idénticas (una por `push` y otra por `pull_request`). El
# disparador `push` ya cubre las ramas con y sin PR.
permissions:
  contents: write

# Si llegan varios pushes seguidos, cancela los builds que quedaron obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar la web e inyectar en el proyecto Android
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # La firma solo ocurre si has cargado los 4 secretos del keystore.
      # Sin ellos el job sigue adelante y solo publica el APK de depuración.
      - name: Detectar credenciales de firma
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin ANDROID_KEYSTORE_BASE64: se omite el APK firmado de release."
          fi

      - name: Compilar APK de release firmado
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Borrar el keystore del runner
        if: always()
        run: rm -f android/release.keystore

      - name: Publicar APKs como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nexus-p2p-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar APKs a la Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
